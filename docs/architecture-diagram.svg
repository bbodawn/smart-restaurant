<rect x="0" y="0" width="1440" height="1120" fill="#f1f5f9"/>
<text x="720.0" y="40" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="bold">智能食堂采购系统 — 架构图（对应当前真实代码）</text>
<text x="720.0" y="66" text-anchor="middle" font-size="15" fill="#475569">LangGraph 并行分析 → 确定性 Policy → Agent5 风险解释 → 人工审批(HITL) → Service 单事务入库</text>
<rect x="50" y="92" width="1330" height="80" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="62" y="114" font-size="15" font-weight="bold" fill="#334155">入口层</text>
<rect x="70" y="118" width="280" height="44" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="210.0" y="135.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">用户 / 前端</text>
<text x="210.0" y="160.0" text-anchor="middle" font-size="12.5" fill="#475569">创建采购单 · HITL 待审批页</text>
<rect x="370" y="118" width="300" height="44" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
<text x="520.0" y="135.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">自动巡检(定时)</text>
<text x="520.0" y="160.0" text-anchor="middle" font-size="12.5" fill="#475569">scan_and_trigger_procurement</text>
<line x1="210" y1="162" x2="320" y2="216" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="520" y1="162" x2="620" y2="216" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="70" y="216" width="660" height="62" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="400.0" y="242.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">FastAPI / Service 层</text>
<text x="400.0" y="267.0" text-anchor="middle" font-size="12.5" fill="#475569">/purchase · /approve · /dashboard · execute_inbound_stock(单事务提交)</text>
<line x1="400" y1="278" x2="400" y2="318" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="50" y="318" width="700" height="560" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="62" y="340" font-size="15" font-weight="bold" fill="#334155">LangGraph 工作流（Redis Checkpoint 保存/恢复）</text>
<rect x="300" y="348" width="140" height="30" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
<text x="370.0" y="368.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">START</text>
<line x1="370" y1="378" x2="370" y2="406" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="80" y="406" width="200" height="46" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="180.0" y="424.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">inventory_analysis</text>
<text x="180.0" y="449.0" text-anchor="middle" font-size="12.5" fill="#475569">确定性 Python · 无 LLM</text>
<rect x="280" y="406" width="200" height="46" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="380.0" y="424.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">price_analysis</text>
<text x="380.0" y="449.0" text-anchor="middle" font-size="12.5" fill="#475569">确定性 Python · 无 LLM</text>
<rect x="480" y="406" width="200" height="46" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="580.0" y="424.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">supplier_analysis</text>
<text x="580.0" y="449.0" text-anchor="middle" font-size="12.5" fill="#475569">确定性 Python · 无 LLM</text>
<line x1="180" y1="452" x2="310" y2="486" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="380" y1="452" x2="380" y2="486" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="580" y1="452" x2="450" y2="486" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="170" y="486" width="420" height="56" rx="9" fill="#fef9c3" stroke="#a16207" stroke-width="1.6"/>
<text x="380.0" y="509.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">deterministic_policy（无 LLM）</text>
<text x="380.0" y="534.0" text-anchor="middle" font-size="12.5" fill="#475569">needs_purchase · quantity · risk_flags · NO/PURCHASE/REVIEW</text>
<line x1="250" y1="542" x2="160" y2="580" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="380" y1="542" x2="380" y2="580" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<line x1="510" y1="542" x2="600" y2="580" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="80" y="580" width="160" height="50" rx="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
<text x="160.0" y="600.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">NO_PURCHASE</text>
<text x="160.0" y="625.0" text-anchor="middle" font-size="12.5" fill="#475569">→ END（不建单）</text>
<rect x="280" y="580" width="200" height="50" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="380.0" y="600.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">PURCHASE</text>
<text x="380.0" y="625.0" text-anchor="middle" font-size="12.5" fill="#475569">policy 已定 quantity / total</text>
<rect x="520" y="580" width="190" height="50" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="615.0" y="600.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">REVIEW</text>
<text x="615.0" y="625.0" text-anchor="middle" font-size="12.5" fill="#475569">命中价格/库存风险</text>
<rect x="280" y="664" width="200" height="44" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text x="380.0" y="681.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">purchase_prepare → purchase_agent</text>
<text x="380.0" y="706.0" text-anchor="middle" font-size="12.5" fill="#475569">status: APPROVED → PURCHASE_CREATED</text>
<line x1="380" y1="630" x2="380" y2="664" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="280" y="742" width="200" height="46" rx="9" fill="#bae6fd" stroke="#0284c7" stroke-width="1.6"/>
<text x="380.0" y="760.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Service：execute_inbound_stock</text>
<text x="380.0" y="785.0" text-anchor="middle" font-size="12.5" fill="#475569">purchase_order_items.quantity</text>
<line x1="380" y1="708" x2="380" y2="742" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="280" y="822" width="200" height="40" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="380.0" y="837.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">MySQL：inventory += qty，订单 COMPLETED</text>
<text x="380.0" y="862.0" text-anchor="middle" font-size="12.5" fill="#475569">同事务 commit · 幂等短路</text>
<line x1="380" y1="788" x2="380" y2="822" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="520" y="664" width="190" height="44" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="615.0" y="681.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">agent5（LLM · 唯一用大模型）</text>
<text x="615.0" y="706.0" text-anchor="middle" font-size="12.5" fill="#475569">summary/risk_level/risk_analysis/recommendation</text>
<line x1="615" y1="630" x2="615" y2="664" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="520" y="742" width="190" height="60" rx="9" fill="#fecaca" stroke="#dc2626" stroke-width="1.6"/>
<text x="615.0" y="767.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">purchase_approval：interrupt()</text>
<text x="615.0" y="792.0" text-anchor="middle" font-size="12.5" fill="#475569">人工 approve / reject（Command(resume) 恢复）</text>
<line x1="615" y1="708" x2="615" y2="742" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="620" y="836" text-anchor="start" font-size="13" fill="#b91c1c" font-style="italic">reject → END（不采购）</text>
<text x="230" y="836" text-anchor="end" font-size="13" fill="#15803d" font-style="italic">approve → 回到 purchase_prepare/purchase_agent</text>
<rect x="780" y="92" width="600" height="240" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="792" y="114" font-size="15" font-weight="bold" fill="#334155">MySQL（业务持久层 · 真正的账）</text>
<rect x="800" y="130" width="560" height="52" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="1080.0" y="151.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">purchase_orders</text>
<text x="1080.0" y="176.0" text-anchor="middle" font-size="12.5" fill="#475569">status: RUNNING / SUSPENDED / COMPLETED / REJECTED</text>
<rect x="800" y="194" width="560" height="52" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="1080.0" y="215.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">purchase_order_items</text>
<text x="1080.0" y="240.0" text-anchor="middle" font-size="12.5" fill="#475569">quantity（真正落库的采购数量）</text>
<rect x="800" y="258" width="560" height="52" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.6"/>
<text x="1080.0" y="279.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">inventory.current_stock</text>
<text x="1080.0" y="304.0" text-anchor="middle" font-size="12.5" fill="#475569">库存真实数字（只有 Service execute 修改）</text>
<line x1="280" y1="860" x2="800" y2="300" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="1050" y="340" text-anchor="middle" font-size="13" fill="#0369a1" font-style="italic">Graph / Agent 从不直接写 DB；只有 Service 层在单事务里提交</text>
<rect x="780" y="380" width="600" height="250" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="792" y="402" font-size="15" font-weight="bold" fill="#334155">Redis（两种完全不同的职责）</text>
<rect x="800" y="416" width="560" height="78" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.6"/>
<text x="1080.0" y="450.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">① Checkpoint（存档点）</text>
<text x="1080.0" y="475.0" text-anchor="middle" font-size="12.5" fill="#475569">工作流暂停位置 + 最新 state（含 agent5_analysis）</text>
<text x="1080" y="560" text-anchor="middle" font-size="12.5" fill="#be123c" font-style="italic">审批接口用同一 thread_id + Command(resume) 从中断处继续，不重跑 START</text>
<rect x="800" y="566" width="560" height="54" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.6"/>
<text x="1080.0" y="588.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">② Distributed Lock（互斥锁）</text>
<text x="1080.0" y="613.0" text-anchor="middle" font-size="12.5" fill="#475569">ingredient 锁（自动巡检）· approval 锁（审批）</text>
<text x="1080" y="644" text-anchor="middle" font-size="12.5" fill="#be123c" font-style="italic">Checkpoint ≠ Lock —— 一个是“存档”，一个是“门锁”</text>
<line x1="730" y1="440" x2="800" y2="440" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="765" y="432" text-anchor="end" font-size="11.5" fill="#be123c" font-style="italic">interrupt 存档/恢复</text>
<line x1="730" y1="580" x2="800" y2="590" stroke="#475569" stroke-width="1.7" marker-end="url(#arr)"/>
<text x="765" y="586" text-anchor="end" font-size="11.5" fill="#be123c" font-style="italic">锁</text>
<rect x="50" y="900" width="1330" height="180" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="62" y="922" font-size="15" font-weight="bold" fill="#334155">最容易忘的关键设计</text>
<text x="90" y="944" text-anchor="start" font-size="16" fill="#0f172a" font-weight="bold">1) 三个状态不混用：</text>
<text x="100" y="944" text-anchor="start" font-size="13.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">1) 三个状态不混用：</tspan>policy_decision.status（决策） ≠ graph state.status（运行时） ≠ purchase_orders.status（DB 业务状态）</text>
<text x="90" y="978" text-anchor="start" font-size="16" fill="#0f172a" font-weight="bold">2) 数据契约（唯一真相链）：</text>
<text x="100" y="978" text-anchor="start" font-size="13.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">2) 数据契约（唯一真相链）：</tspan>policy_decision.quantity → purchase_order_items.quantity → execute_inbound_stock → inventory.current_stock</text>
<text x="90" y="1012" text-anchor="start" font-size="16" fill="#0f172a" font-weight="bold">3) 职责分层：</text>
<text x="100" y="1012" text-anchor="start" font-size="13.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">3) 职责分层：</tspan>确定性计算=代码（3 个 analysis + policy）；风险解释=Agent5（不能改数量/状态/越权）；最终授权=人(HITL)；真正写库=Service</text>
<text x="90" y="1046" text-anchor="start" font-size="16" fill="#0f172a" font-weight="bold">4) 三层并发保护：</text>
<text x="100" y="1046" text-anchor="start" font-size="13.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">4) 三层并发保护：</tspan>Redis ingredient 锁（防两 Worker 双购） + _has_open_order（DB 业务复查） + execute_inbound_stock 幂等（COMPLETED 短路）</text>
<text x="90" y="1080" text-anchor="start" font-size="16" fill="#0f172a" font-weight="bold">5) 边界（未夸大）：</text>
<text x="100" y="1080" text-anchor="start" font-size="13.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">5) 边界（未夸大）：</tspan>3 天预测为当前规则；supplier 只是 Analysis(快照)，不是多供应商比价/选优；无 3~7 天健康区间/高级预测/RBAC/锁续租等生产化设施</text>
</svg>