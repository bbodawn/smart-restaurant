<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能餐厅 AI Agent 控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { slate: {50:'#F8FAFC',100:'#F1F5F9',200:'#E2E8F0',300:'#CBD5E1',500:'#64748B',700:'#334155',800:'#1E293B'} } } } };
  </script>
  <style>
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .fade-in { animation: fadeIn .35s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    .bar-transition { transition: width .6s cubic-bezier(.4,0,.2,1); }
    .toast { transition: all .3s ease; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse-amber { animation: pulseAmber 1.4s ease-in-out infinite; }
    @keyframes pulseAmber { 0%,100%{ box-shadow:0 0 0 0 rgba(245,158,11,.35);} 50%{ box-shadow:0 0 0 6px rgba(245,158,11,0);} }
    .pulse-rose { animation: pulseRose 1.4s ease-in-out infinite; }
    @keyframes pulseRose { 0%,100%{ box-shadow:0 0 0 0 rgba(244,63,94,.35);} 50%{ box-shadow:0 0 0 6px rgba(244,63,94,0);} }
    .timeline-arrow { color:#CBD5E1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <!-- 顶部悬浮控制栏 -->
  <header class="sticky top-0 z-20 backdrop-blur bg-white/80 border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-lg shadow-sm">智</div>
        <div>
          <h1 class="text-base font-semibold text-slate-800 leading-tight">智能餐厅 · AI Agent 控制台</h1>
          <p class="text-xs text-slate-500">LangGraph Multi-Agent 履约工作台</p>
        </div>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <div class="px-4 py-2 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center gap-2">
          <span class="text-xs text-slate-500">虚拟系统日期</span>
          <span id="virtual-date" class="font-semibold text-sm tabular-nums text-slate-800">加载中…</span>
          <button id="btn-reset" title="重置时钟" class="ml-1 w-7 h-7 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-500 transition">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M4 9a8 8 0 0113.9-2.5M20 15a8 8 0 01-13.9 2.5"/></svg>
          </button>
        </div>
        <button data-days="1" class="btn-advance px-4 py-2 rounded-xl bg-white border border-slate-200 text-sm font-medium shadow-sm hover:bg-slate-100 transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">快进 1 天</button>
        <button data-days="2" class="btn-advance px-4 py-2 rounded-xl bg-slate-800 text-white text-sm font-medium shadow-sm hover:bg-slate-700 transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">快进 2 天</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6 space-y-8">
    <!-- KPI 指标卡 -->
    <section id="kpi-row" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5">
        <div class="text-xs text-slate-400 mb-2">自动化采购率</div>
        <div class="font-semibold text-2xl tabular-nums text-slate-800"><span id="kpi-rate">—</span><span class="text-base text-slate-400">%</span></div>
      </div>
      <div class="bg-white border border-amber-200 rounded-2xl shadow-sm p-5">
        <div class="text-xs text-amber-600 mb-2">待审批挂起单 (HITL)</div>
        <div id="kpi-pending" class="font-semibold text-2xl tabular-nums text-amber-700">—</div>
      </div>
      <div class="bg-white border border-rose-200 rounded-2xl shadow-sm p-5">
        <div class="text-xs text-rose-500 mb-2">已拦截风控单</div>
        <div id="kpi-intercepted" class="font-semibold text-2xl tabular-nums text-rose-600">—</div>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-5">
        <div class="text-xs text-slate-400 mb-2">本月累计补货金额</div>
        <div id="kpi-restock" class="font-semibold text-2xl tabular-nums text-emerald-700">—</div>
      </div>
    </section>

    <!-- 库存健康度看板 -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-slate-800 uppercase tracking-wide">食材库存健康度</h2>
        <div class="flex items-center gap-3">
          <span class="text-xs text-slate-400">当前库存 / 安全线比率</span>
          <button id="btn-add-ingredient" onclick="openAddIngredientModal()" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-white border border-slate-200 text-xs font-medium text-slate-600 shadow-sm hover:bg-slate-100 transition">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            新增食材
          </button>
        </div>
      </div>
      <div id="inventory-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    </section>

    <!-- Tab 区 -->
    <section>
      <div class="flex items-center gap-2 border-b border-slate-200 mb-4">
        <button data-tab="pending" class="tab-btn px-4 py-2 -mb-px border-b-2 text-sm font-medium transition">
          待办审批中心 <span id="badge-pending" class="ml-1 text-xs px-1.5 rounded-full"></span>
        </button>
        <button data-tab="history" class="tab-btn px-4 py-2 -mb-px border-b-2 text-sm font-medium transition">
          采购历史与履约记录 <span id="badge-history" class="ml-1 text-xs px-1.5 rounded-full"></span>
        </button>
      </div>
      <div id="order-list" class="space-y-3"></div>
    </section>
  </main>

  <div id="toast" class="toast fixed top-20 left-1/2 -translate-x-1/2 px-5 py-3 rounded-xl bg-slate-800 text-white text-sm shadow-xl opacity-0 pointer-events-none z-50"></div>

  <script>
    const API = '/api/v1';
    let state = { inventory: [], orders: [], virtual_date: '', kpi: {} };
    let activeTab = 'pending';

    const healthUI = {
      healthy:  { badge:'bg-emerald-50 text-emerald-700 border-emerald-200', bar:'bg-emerald-500', label:'健康' },
      low:      { badge:'bg-amber-50 text-amber-700 border-amber-200',     bar:'bg-amber-500', label:'偏低' },
      critical: { badge:'bg-rose-50 text-rose-700 border-rose-200',        bar:'bg-rose-500', label:'缺货' }
    };
    const statusUI = {
      COMPLETED:'bg-emerald-50 text-emerald-700 border-emerald-200',
      STOP:     'bg-emerald-50 text-emerald-700 border-emerald-200',
      SUSPENDED:'bg-amber-50 text-amber-700 border-amber-200',
      REJECTED: 'bg-rose-50 text-rose-700 border-rose-200',
      RUNNING:  'bg-slate-100 text-slate-600 border-slate-200',
      NO_PURCHASE:'bg-slate-100 text-slate-500 border-slate-200',
      PURCHASE_CREATED:'bg-emerald-50 text-emerald-700 border-emerald-200'
    };

    function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.opacity='1'; setTimeout(()=>t.style.opacity='0',2200); }
    async function api(path, opts={}){
      const r = await fetch(API + path, Object.assign({ headers:{'Content-Type':'application/json'} }, opts));
      if(!r.ok){ let m=r.status+' '+r.statusText; try{const j=await r.json(); m=j.detail||m;}catch(e){} throw new Error(m); }
      return r.json();
    }

    async function loadDashboard(){
      const d = await api('/dashboard');
      state = d;
      document.getElementById('virtual-date').textContent = d.virtual_date || '—';
      renderKpi(); renderInventory(); renderTabs(); renderOrders();
    }

    function renderKpi(){
      const k = state.kpi || {};
      document.getElementById('kpi-rate').textContent = k.auto_procurement_rate ?? 0;
      document.getElementById('kpi-pending').textContent = k.pending_approvals ?? 0;
      document.getElementById('kpi-intercepted').textContent = k.intercepted_risk_orders ?? 0;
      document.getElementById('kpi-restock').textContent = '¥' + (k.month_restock_amount ?? 0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    }

    function renderInventory(){
      const grid = document.getElementById('inventory-grid');
      grid.innerHTML = '';
      state.inventory.forEach((it,idx)=>{
        const h = healthUI[it.health]||healthUI.healthy;
        const barPct = Math.min(200, Math.max(0, it.ratio));
        const card = document.createElement('div');
        card.className='fade-in bg-white border border-slate-200 rounded-2xl shadow-sm p-4 flex flex-col gap-3';
        card.style.animationDelay=(idx*30)+'ms';
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="text-xs text-slate-400 mb-1">${it.category}</div>
              <div class="font-semibold text-slate-800">${it.name}</div>
            </div>
            <span class="text-xs px-2 py-0.5 rounded-full border font-medium ${h.badge}">${h.label}</span>
          </div>
          <div>
            <div class="flex justify-between text-xs text-slate-500 mb-1">
              <span class="font-semibold text-slate-800 text-sm tabular-nums">${it.current_stock}<span class="text-slate-400 font-normal"> ${it.unit}</span></span>
              <span>安全线 ${it.safety_stock}</span>
            </div>
            <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
              <div class="bar-transition h-full rounded-full ${h.bar}" style="width:${barPct<=200?barPct:100}%"></div>
            </div>
            <div class="flex justify-between text-[11px] text-slate-400 mt-1.5">
              <span>日消耗 ${it.daily_sales}</span><span>${it.ratio}%</span>
            </div>
          </div>`;
        grid.appendChild(card);
      });
    }

    function renderTabs(){
      document.querySelectorAll('.tab-btn').forEach(b=>{
        const on = b.dataset.tab === activeTab;
        b.className = 'tab-btn px-4 py-2 -mb-px border-b-2 text-sm font-medium transition ' + (on ? 'border-slate-800 text-slate-800' : 'border-transparent text-slate-400 hover:text-slate-600');
      });
      const badgeP = document.getElementById('badge-pending');
      const badgeH = document.getElementById('badge-history');
      const pendingN = state.orders.filter(o=>o.status==='SUSPENDED').length;
      const histN = state.orders.filter(o=>o.status==='COMPLETED'||o.status==='REJECTED'||o.status==='PURCHASE_CREATED').length;
      badgeP.textContent = pendingN;
      badgeP.className = 'ml-1 text-xs px-1.5 rounded-full ' + (pendingN>0?'bg-amber-100 text-amber-700':'bg-slate-100 text-slate-400');
      badgeH.textContent = histN;
      badgeH.className = 'ml-1 text-xs px-1.5 rounded-full bg-slate-100 text-slate-400';
    }

    // LangGraph 4 节点时间线状态
    const langNodes = [
      { label:'需求预测', agent:'DemandAgent', idx:1 },
      { label:'风控评估', agent:'RiskAgent', idx:2 },
      { label:'经理审批', agent:'HITL', idx:3 },
      { label:'自动入库', agent:'Stocking', idx:4 }
    ];

    function nodeFor(status){
      // 返回当前停靠节点序号 1-4
      if(status==='SUSPENDED'||status==='PENDING') return 3;
      if(status==='REJECTED') return 3;
      if(status==='RUNNING') return 1;
      return 4; // COMPLETED / PURCHASE_CREATED / NO_PURCHASE
    }

    function timelineHTML(status){
      const cur = nodeFor(status);
      return `<div class="flex items-center gap-1 mt-3">
        ${langNodes.map(n=>{
          const done = n.idx < cur;
          const active = n.idx === cur;
          const isSusp = (status==='SUSPENDED'||status==='PENDING');
          let style='bg-slate-100 text-slate-400 border-slate-200';
          if(done) style='bg-emerald-50 text-emerald-700 border-emerald-200';
          if(active) style = isSusp ? 'bg-amber-50 text-amber-700 border-amber-200 pulse-amber' : 'bg-emerald-50 text-emerald-700 border-emerald-200';
          if(status==='REJECTED' && active) style='bg-rose-50 text-rose-700 border-rose-200 pulse-rose';
          return `<div class="flex-1 text-center px-1 py-1.5 rounded-lg border text-[11px] font-medium ${style}" title="${n.agent}">${n.idx}. ${n.label}</div>`;
        }).join('')}
      </div>`;
    }

    function orderCard(o, showActions){
      const st = statusUI[o.status]||'bg-slate-100 text-slate-600 border-slate-200';
      const d = document.createElement('div');
      d.className = 'fade-in bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden';
      const isSus = o.status==='SUSPENDED';
      d.innerHTML = `
        <div class="flex items-center justify-between px-5 py-4 flex-wrap gap-3">
          <div class="flex items-center gap-4">
            <span class="font-mono text-sm text-slate-700 font-medium">#${o.order_id}</span>
            <div>
              <div class="font-medium text-slate-800">${o.ingredient||'未知食材'}</div>
              <div class="text-xs text-slate-400">${o.order_no}</div>
            </div>
          </div>
          <div class="flex items-center gap-4 flex-wrap">
            <span class="text-sm text-slate-600">数量 <b class="tabular-nums">${o.quantity??'—'}</b> kg</span>
            <span class="text-sm text-slate-500">¥<b class="tabular-nums">${(+o.total_amount).toFixed(2)}</b></span>
            <span class="text-xs px-2.5 py-1 rounded-full border font-medium ${st}">${o.status}</span>
          </div>
        </div>
        <div class="px-5 pb-4">
          ${timelineHTML(o.status)}
          <div class="grid md:grid-cols-2 gap-3 mt-3 text-sm">
            <div class="rounded-xl bg-slate-50 border border-slate-200 p-3">
              <div class="text-[11px] font-semibold text-slate-400 mb-1">DemandAgent 需求预测</div>
              <p class="text-slate-700 leading-relaxed">${o.demand_reasoning || '—'}</p>
            </div>
            <div class="rounded-xl ${isSus?'bg-amber-50/60 border-amber-200':'bg-slate-50 border-slate-200'} border p-3">
              <div class="text-[11px] font-semibold ${isSus?'text-amber-600':'text-slate-400'} mb-1">RiskAgent 风控分析</div>
              <p class="text-slate-700 leading-relaxed whitespace-pre-line">${o.risk_analysis_report || '—'}</p>
            </div>
          </div>
          ${showActions ? `
          <div class="mt-3 flex gap-2">
            <button class="btn-approve px-4 py-1.5 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-500 transition" data-id="${o.order_id}">批准采购</button>
            <button class="btn-reject px-4 py-1.5 rounded-lg bg-rose-50 text-rose-700 border border-rose-200 text-sm font-medium hover:bg-rose-100 transition" data-id="${o.order_id}">驳回</button>
          </div>` : ''}
          ${o.status==='COMPLETED'||o.status==='REJECTED' ? `<div class="mt-3 text-xs text-slate-400">${o.status==='COMPLETED'?'补货数量':'驳回时间'}：¥${(+o.total_amount).toFixed(2)} · 处理时间 ${o.updated_at || '—'}</div>` : ''}
        </div>`;
      return d;
    }

    function renderOrders(){
      const list = document.getElementById('order-list');
      list.innerHTML = '';
      let orders;
      if(activeTab==='pending'){
        orders = state.orders.filter(o=>o.status==='SUSPENDED');
      } else {
        orders = state.orders.filter(o=>o.status==='COMPLETED'||o.status==='REJECTED'||o.status==='PURCHASE_CREATED');
      }
      if(orders.length===0){
        list.innerHTML=`<div class="text-center text-slate-400 text-sm py-10 bg-white border border-slate-200 rounded-2xl shadow-sm">${activeTab==='pending'?'暂无待审批订单。':'暂无历史履约记录。'}</div>`;
        return;
      }
      orders.forEach(o=>{
        const showActions = activeTab==='pending' && o.status==='SUSPENDED';
        list.appendChild(orderCard(o, showActions));
      });
      document.querySelectorAll('.btn-approve').forEach(b=>b.onclick=()=>decide(b.dataset.id,true));
      document.querySelectorAll('.btn-reject').forEach(b=>b.onclick=()=>decide(b.dataset.id,false));
    }

    async function decide(orderId, approved){
      try{
        await api('/purchase/'+orderId+'/approve', { method:'POST', body: JSON.stringify({ approved, approval_reason: approved?'控制台人工批准':'控制台人工驳回' }) });
        showToast(approved?'✓ 已批准采购，库存已自动补满':'订单已驳回');
        await loadDashboard();
      }catch(e){ showToast('操作失败：'+e.message); }
    }

    // 防抖：点击后禁用按钮并显示 Spinner，接口返回渲染完成后恢复
    let advancing = false;
    function setAdvancing(on){
      advancing = on;
      document.querySelectorAll('.btn-advance').forEach(b=>{
        const days = b.dataset.days;
        if(on){
          b.disabled = true;
          b.innerHTML = `<span class="inline-flex items-center gap-1.5"><svg class="w-3.5 h-3.5 spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10" class="opacity-25"/><path d="M12 2a10 10 0 0 1 10 10" class="opacity-90"/></svg>处理中</span>`;
        } else {
          b.disabled = false;
          b.innerHTML = (days==='1'?'快进 1 天':'快进 2 天');
          b.className = 'btn-advance px-4 py-2 rounded-xl ' + (days==='1'?'bg-white border border-slate-200 text-sm font-medium shadow-sm hover:bg-slate-100':'bg-slate-800 text-white text-sm font-medium shadow-sm hover:bg-slate-700') + ' transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed';
        }
      });
      const r = document.getElementById('btn-reset');
      if(r) r.disabled = on;
    }

    document.querySelectorAll('.btn-advance').forEach(b=>b.addEventListener('click', async ()=>{
      if(advancing) return;
      setAdvancing(true);
      const days = b.dataset.days;
      try{
        const r = await api('/test/advance-day', { method:'POST', body: JSON.stringify({ days: parseInt(days) }) });
        showToast('已快进 '+days+' 天');
        await loadDashboard();
      }catch(e){ showToast('快进失败：'+e.message); }
      finally { setAdvancing(false); }
    }));

    document.getElementById('btn-reset').addEventListener('click', async ()=>{
      try{ await api('/test/reset-clock',{method:'POST'}); showToast('虚拟时钟已重置'); await loadDashboard(); }catch(e){ showToast('重置失败：'+e.message); }
    });

    document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>{ activeTab = b.dataset.tab; renderTabs(); renderOrders(); }));

    // ---- 新增食材 Modal ----
    // 打开/关闭函数在每次调用时重新获取 DOM 节点，
    // 避免脚本初始化时 Modal 尚未渲染导致 modal 变量为 null。
    function openAddIngredientModal(){
      const m = document.getElementById('ing-modal');
      if(m){ m.classList.remove('hidden'); m.classList.add('flex'); }
      onCategoryChange();
    }
    function closeAddIngredientModal(){
      const m = document.getElementById('ing-modal');
      if(m){ m.classList.add('hidden'); m.classList.remove('flex'); }
    }
    function openModal(){ openAddIngredientModal(); }
    function closeModal(){ closeAddIngredientModal(); }
    function val(id, d=0){ const el=document.getElementById(id); return parseFloat(el.value) || d; }
    // 分类 -> 预设标签 & 单位 映射
    const CAT_META = {
      '主食':      { unit:'kg', tags:['高筋面粉','五常大米','手工水饺','意面','燕麦'] },
      '生鲜肉类':  { unit:'kg', tags:['原切雪花牛肉','特级猪五花','鲜嫩鸡胸肉','羊肉卷'] },
      '水产海鲜':  { unit:'kg', tags:['冰鲜基围虾','三文鱼排','罗非鱼片','鲜活生蚝'] },
      '蔬菜时蔬':  { unit:'kg', tags:['有机菜心','高山土豆','罗马生菜','西兰花'] },
      '调料':      { unit:'L',  tags:['招牌特调酱油','非转基因大豆油','特级香醋','蚝油','食用海盐'] },
    };
    const DEFAULT_CAT = '主食';
    function fillName(v){
      const n = document.getElementById('f-name');
      n.value = v;
      n.focus();
    }
    // 分类切换联动：更新名称快捷标签 + 单位显示
    function onCategoryChange(){
      const cat = document.getElementById('f-category').value || DEFAULT_CAT;
      const meta = CAT_META[cat] || { unit:'kg', tags:[] };
      ['unit-stock','unit-safety','unit-daily'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent = meta.unit; });
      const lp = document.getElementById('lbl-price'); if(lp) lp.textContent = '¥/' + meta.unit;
      const tg = document.getElementById('preset-tags');
      if(tg){
        tg.innerHTML = meta.tags.map(t => `<span class="inline-block px-2.5 py-1 rounded-full text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 cursor-pointer hover:bg-emerald-100 transition" onclick="fillName('${t}')">${t}</span>`).join(' ');
        if(meta.tags.length===0){ tg.innerHTML = '<span class="text-xs text-slate-400">无预设，可手动输入</span>'; }
      }
    }
    // Modal 事件绑定改为按钮内联 onclick（见 HTML），避免 script 先于 Modal 渲染时的 null 引用错误
    async function submitAddIngredient(event){
      if(event) event.preventDefault();
      const name = document.getElementById('f-name').value.trim();
      if(!name){ showToast('请填写食材名称'); return; }
      // 前端数值>0 校验
      const stock=val('f-stock'), safety=val('f-safety'), daily=val('f-daily'), price=val('f-price');
      if(stock<=0||safety<=0||daily<=0||price<=0){ showToast('库存/安全线/日消耗/单价需大于 0'); return; }
      const payload = {
        name,
        category: document.getElementById('f-category').value,
        unit: (CAT_META[document.getElementById('f-category').value] || {unit:'kg'}).unit,
        current_stock: stock,
        safety_stock: safety,
        daily_consumption: daily,
        unit_price: price,
      };
      const btn = document.getElementById('btn-submit-ing');
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = '提交中…';
      try {
        const r = await fetch(API + '/ingredients', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await r.json();
        if(!r.ok) throw new Error(data.detail || r.statusText);
        showToast('食材添加成功：' + data.name);
        closeModal();
        ['f-name','f-stock','f-safety','f-daily','f-price'].forEach(id=>document.getElementById(id).value='');
        document.getElementById('f-category').selectedIndex = 0;
        onCategoryChange();
        await loadDashboard();
      } catch(e){
        // 失败：原位红字提示，保持 Modal 打开
        const errEl = document.getElementById('modal-error-msg');
        if(errEl){
          errEl.textContent = e.message || '添加失败';
          errEl.classList.remove('hidden');
        } else {
          showToast('新增失败：' + e.message);
        }
      }
      finally { btn.disabled = false; btn.textContent = orig; }
    }
    window.submitAddIngredient = submitAddIngredient;

    // 输入时隐藏原位错误提示
    function hideIngError(){
      const errEl = document.getElementById('modal-error-msg');
      if(errEl) errEl.classList.add('hidden');
    }
    // 暴露数据刷新接口（供提交成功后调用）
    window.fetchDashboardData = loadDashboard;
    window.hideIngError = hideIngError;

    loadDashboard().catch(e=>showToast('加载失败：'+e.message));
  </script>

  <!-- 新增食材 Modal -->
  <div id="ing-modal" class="fixed inset-0 z-50 hidden items-center justify-center">
    <div class="absolute inset-0 bg-slate-900/30 backdrop-blur-sm" id="ing-modal-mask" onclick="closeAddIngredientModal()"></div>
    <div class="relative bg-white w-full max-w-md mx-4 rounded-2xl shadow-2xl border border-slate-200 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-semibold text-slate-800">新增食材</h3>
        <button id="ing-modal-close" onclick="closeAddIngredientModal()" class="w-7 h-7 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-500 block mb-1">食材名称 *</label>
          <input id="f-name" oninput="hideIngError()" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-slate-400" placeholder="点击下方标签快捷选择，或手动输入" />
          <p id="modal-error-msg" class="text-red-500 text-xs mt-1 hidden"></p>
          <div id="preset-tags" class="mt-2 flex flex-wrap gap-1.5"></div>
        </div>
        <div>
          <label class="text-xs text-slate-500 block mb-1">分类</label>
          <select id="f-category" onchange="onCategoryChange(event)" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm bg-white focus:outline-none focus:ring-1 focus:ring-slate-400">
            <option value="主食">主食</option>
            <option value="生鲜肉类">生鲜肉类</option>
            <option value="水产海鲜">水产海鲜</option>
            <option value="蔬菜时蔬">蔬菜时蔬</option>
            <option value="调料">调料</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-500 block mb-1">当前库存</label>
            <div class="flex items-center gap-1.5">
              <input id="f-stock" type="number" step="0.01" class="flex-1 w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-slate-400" />
              <span class="unit-label text-xs text-slate-400 w-8 text-center" id="unit-stock">kg</span>
            </div>
          </div>
          <div>
            <label class="text-xs text-slate-500 block mb-1">安全线</label>
            <div class="flex items-center gap-1.5">
              <input id="f-safety" type="number" step="0.01" class="flex-1 w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-slate-400" />
              <span class="unit-label text-xs text-slate-400 w-8 text-center" id="unit-safety">kg</span>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-500 block mb-1">日消耗</label>
            <div class="flex items-center gap-1.5">
              <input id="f-daily" type="number" step="0.01" class="flex-1 w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-slate-400" />
              <span class="unit-label text-xs text-slate-400 w-8 text-center" id="unit-daily">kg</span>
            </div>
          </div>
          <div>
            <label class="text-xs text-slate-500 block mb-1">单价 <span id="lbl-price" class="text-slate-400">¥/kg</span></label>
            <input id="f-price" type="number" step="0.01" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-slate-400" />
          </div>
        </div>
      </div>
      <div class="mt-5 flex justify-end gap-2">
        <button id="btn-cancel-ing" onclick="closeAddIngredientModal()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-sm font-medium hover:bg-slate-200 transition">取消</button>
        <button id="btn-submit-ing" onclick="submitAddIngredient(event)" class="px-4 py-2 rounded-lg bg-slate-800 text-white text-sm font-medium hover:bg-slate-700 transition">添加食材</button>
      </div>
    </div>
  </div>
</body>
</html>
