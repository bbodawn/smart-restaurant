[pytest]
testpaths = tests
asyncio_mode = auto
# 全会话共用同一事件循环：app.core.redis 是模块级单例，绑定首个使用它的 loop，
# 若每个测试单独 loop，跨测试复用该单例会报 Event loop is closed。
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
markers =
    live: 真实基础设施（MySQL/Redis）端到端测试；需 TEST_LIVE=1 显式开启
addopts = -ra
